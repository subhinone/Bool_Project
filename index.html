<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="src\assets\bool_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOOL</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Kakao Map API - HTTPS로 안전하게 로드 (중복 제거) -->
    <script
      type="text/javascript"
      src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=65f4831b3ba213db5449a19d1bcf1eb1&autoload=false"
      onload="console.log('✅ Kakao Maps SDK loaded successfully')"
      onerror="console.error('❌ Failed to load Kakao Maps SDK')"
    ></script>
    <script type="text/javascript">
      // Kakao Maps SDK를 수동으로 로드하여 document.write 경고 방지
      if (window.kakao && window.kakao.maps) {
        window.kakao.maps.load(function() {
          console.log('✅ Kakao Maps API is ready to use');
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
